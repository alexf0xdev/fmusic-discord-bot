services:
  fmusic-discord-bot:
    container_name: fmusic-discord-bot
    image: ghcr.io/alexf0xdev/fmusic-discord-bot:latest
    restart: always
    environment:
      BOT_TOKEN: '<BOT_TOKEN>'
      BOT_VOLUME: 40
      # Split by ;
      LAVALINK_IDS: '<LAVALINK_IDS>'
      LAVALINK_HOSTS: '<LAVALINK_HOSTS>'
      LAVALINK_PORTS: '<LAVALINK_POTS>'
      LAVALINK_PASSWORDS: '<LAVALINK_PASSWORDS>'
      SENTRY_DSN: '<SENTRY_DSN>'
    networks:
      - fmusic-discord-bot
networks:
  fmusic-discord-bot:
    name: fmusic-discord-bot
